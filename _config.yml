# ---------------------------------------------------------------------------
# Site settings
# ---------------------------------------------------------------------------
title: Computational Linguistics & Psycholinguistics
# Short summary used by search engines and link previews.
description: >-
  A research unit at Tilburg University studying language in people and in
  machines.
lang: en

parent:
  name: Research Center for Cognitive Science and Artificial Intelligence
  url: https://www.tilburguniversity.edu/about/schools/tshd/departments/dca
university:
  name: Tilburg University
  url: https://www.tilburguniversity.edu

# Menu: one entry per page, in the order shown in the header.
navigation:
  - title: People
    page: people.md
  - title: Publications
    page: publications.md
  - title: News
    page: news.md
  - title: Contact
    page: contact.md

# Bluesky accounts whose posts appear on the News page.
bluesky_feed:
  - name: Grzegorz Chrupała
    handle: grzegorz.chrupala.me
  - name: Céline Angonin
    handle: cangonin.bsky.social
  - name: Chris Emmery
    handle: cmry.bsky.social
  - name: Libby Lepp
    handle: lisalepp.bsky.social
  - name: Chiara Manna
    handle: chiaramanna.bsky.social
  - name: Hosein Mohebbi
    handle: hmohebbi.bsky.social
  - name: Bruno Nicenboim
    handle: bruno-nicenboim.fediscience.org.ap.brid.gy
  - name: Gaofei Shen
    handle: gaofeishen.com
  - name: Dimitar Shterionov
    handle: dimitarsh1.bsky.social

# Where the site lives: repository github.com/tcsai/language-computation,
# served at https://tcsai.github.io/language-computation/.
# If the repository is renamed, change baseurl to match.
url: "https://tcsai.github.io"
baseurl: "/language-computation"
github_repo: https://github.com/tcsai/language-computation

# ---------------------------------------------------------------------------
# Build settings (no need to edit). All plugins are supported by GitHub Pages.
# ---------------------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-optional-front-matter # Markdown files need no front matter
  - jekyll-titles-from-headings  # page title = first heading
  - jekyll-relative-links        # [People](people.md) links work
  - jekyll-seo-tag
  - jekyll-sitemap

optional_front_matter:
  remove_originals: true

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
