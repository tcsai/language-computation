<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 0 134 130" role="img" aria-labelledby="logo-title">
  <title id="logo-title">Baby robot with a speech balloon</title>
  <style>
    .ink { fill: #1d3f73; }
    .line { stroke: #1d3f73; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #a9c1ee; }
      .line { stroke: #a9c1ee; }
    }
  </style>
  <defs>
    <!-- Holes are cut out, so the logo is one colour on any background. -->
    <mask id="balloon-holes">
      <rect x="-10" y="-10" width="200" height="200" fill="#fff"/>
      <circle cx="86" cy="24" r="3.4"/>
      <circle cx="98" cy="24" r="3.4"/>
      <circle cx="110" cy="24" r="3.4"/>
    </mask>
    <mask id="face-hole">
      <rect x="-10" y="-10" width="200" height="200" fill="#fff"/>
      <rect x="26" y="43" width="48" height="37" rx="16"/>
    </mask>
    <mask id="eye-highlights">
      <rect x="-10" y="-10" width="200" height="200" fill="#fff"/>
      <circle cx="37.5" cy="60" r="2.2"/>
      <circle cx="59.5" cy="60" r="2.2"/>
    </mask>
    <!-- The legs sit in front of the torso, with a thin gap around them. -->
    <mask id="torso-holes">
      <rect x="-10" y="-10" width="200" height="200" fill="#fff"/>
      <circle cx="50" cy="103" r="3.8"/>
      <ellipse cx="26" cy="115" rx="12.5" ry="10.5" transform="rotate(-30 26 115)" stroke="#000" stroke-width="5"/>
      <ellipse cx="74" cy="115" rx="12.5" ry="10.5" transform="rotate(30 74 115)" stroke="#000" stroke-width="5"/>
    </mask>
  </defs>

  <!-- Speech balloon -->
  <g transform="translate(10 -4)">
    <path class="ink" mask="url(#balloon-holes)" d="M84 8h28a12 12 0 0 1 12 12v8a12 12 0 0 1-12 12H96l-14 10 3-10.4A12 12 0 0 1 72 28v-8A12 12 0 0 1 84 8z"/>
  </g>

  <!-- Antenna -->
  <path class="line" d="M50 35V22" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <circle class="ink" cx="50" cy="18" r="5"/>

  <!-- Ears -->
  <rect class="ink" x="9" y="51" width="7" height="22" rx="3.5"/>
  <rect class="ink" x="84" y="51" width="7" height="22" rx="3.5"/>

  <!-- Head: large and round, like a baby's, with an open face -->
  <rect class="ink" mask="url(#face-hole)" x="18" y="34" width="64" height="55" rx="24"/>

  <!-- Eyes and smile -->
  <g class="ink" mask="url(#eye-highlights)">
    <circle cx="39" cy="62" r="6.5"/>
    <circle cx="61" cy="62" r="6.5"/>
  </g>
  <path class="line" d="M45 71q5 4.5 10 0" stroke-width="2.6" stroke-linecap="round" fill="none"/>

  <!-- Sitting body: torso with a belly button, legs in front -->
  <rect class="ink" mask="url(#torso-holes)" x="31" y="92" width="38" height="32" rx="14"/>
  <ellipse class="ink" cx="26" cy="115" rx="12.5" ry="10.5" transform="rotate(-30 26 115)"/>
  <ellipse class="ink" cx="74" cy="115" rx="12.5" ry="10.5" transform="rotate(30 74 115)"/>
</svg>
