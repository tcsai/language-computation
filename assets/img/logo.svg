<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Baby robot chatbot logo</title>
  <desc id="desc">Editable vector logo of a cute seated baby robot with a speech bubble.</desc>
  <g id="logo" fill="#173F78">
    <!-- Antenna -->
    <rect id="antenna-stem" x="303" y="58" width="14" height="54" rx="7"/>
    <circle id="antenna-tip" cx="310" cy="50" r="18"/>

    <!-- Head shell -->
    <rect id="head" x="116" y="108" width="388" height="270" rx="112"/>
    <!-- Face inset, knocked out using white fill for easy editing -->
    <rect id="face" x="164" y="158" width="292" height="170" rx="78" fill="#FFFFFF"/>

    <!-- Ears -->
    <rect id="ear-left" x="89" y="186" width="40" height="110" rx="20"/>
    <rect id="ear-right" x="491" y="186" width="40" height="110" rx="20"/>

    <!-- Eyes -->
    <circle id="eye-left" cx="240" cy="240" r="30"/>
    <circle id="eye-right" cx="380" cy="240" r="30"/>
    <circle id="eye-left-highlight" cx="230" cy="230" r="7" fill="#FFFFFF"/>
    <circle id="eye-right-highlight" cx="370" cy="230" r="7" fill="#FFFFFF"/>

    <!-- Smile -->
    <path id="smile" d="M285 286c8 14 18 21 31 21s23-7 31-21" fill="none" stroke="#173F78" stroke-width="14" stroke-linecap="round"/>

    <!-- Body -->
    <path id="body" d="M214 394c25-14 60-22 96-22s71 8 96 22l-18 110c-5 31-32 54-64 54h-28c-32 0-59-23-64-54z"/>
    <path id="bib" d="M259 404c14-8 31-12 51-12s37 4 51 12v64c0 24-20 44-44 44h-14c-24 0-44-20-44-44z" fill="#FFFFFF"/>
    <circle id="chest-button" cx="310" cy="435" r="16"/>

    <!-- Feet -->
    <ellipse id="foot-left" cx="214" cy="506" rx="48" ry="64" transform="rotate(20 214 506)"/>
    <ellipse id="foot-right" cx="406" cy="506" rx="48" ry="64" transform="rotate(-20 406 506)"/>

    <!-- Speech bubble -->
    <path id="bubble" d="M392 62h154c35 0 62 27 62 62v54c0 35-27 62-62 62H466l-48 38 12-38h-38c-35 0-62-27-62-62v-54c0-35 27-62 62-62z"/>
    <circle cx="430" cy="151" r="12" fill="#FFFFFF"/>
    <circle cx="482" cy="151" r="12" fill="#FFFFFF"/>
    <circle cx="534" cy="151" r="12" fill="#FFFFFF"/>
  </g>
</svg>
